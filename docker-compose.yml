name: claude-architecture

services:
  web:
    build:
      context: ./frontend
      dockerfile: web/Dockerfile
    image: claude-arch/web:local
    container_name: claude-arch-web
    ports:
      - "3000:3000"
    env_file:
      - ./_common/.env
    environment:
      - NODE_ENV=production
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  gateway:
    build:
      context: .
      dockerfile: backend/gateway/Dockerfile
    image: claude-arch/gateway:local
    container_name: claude-arch-gateway
    ports:
      - "4000:4000"
    env_file:
      - ./_common/.env
    environment:
      - NODE_ENV=production
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - internal

  auth-service:
    build:
      context: .
      dockerfile: backend/auth-service/Dockerfile
    image: claude-arch/auth-service:local
    container_name: claude-arch-auth-service
    env_file:
      - ./_common/.env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - internal

  user-service:
    build:
      context: .
      dockerfile: backend/user-service/Dockerfile
    image: claude-arch/user-service:local
    container_name: claude-arch-user-service
    env_file:
      - ./_common/.env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - internal

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    image: claude-arch/mcp:local
    container_name: claude-arch-mcp
    ports:
      - "5000:5000"
    env_file:
      - ./_common/.env
    environment:
      - NODE_ENV=production
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge
