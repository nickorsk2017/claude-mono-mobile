name: claude-architecture

services:
  web:
    build:
      context: ./frontend
      dockerfile: web/Dockerfile
    image: claude-arch/web:local
    container_name: claude-arch-web
    ports:
      - "3000:3000"
    env_file:
      - ./_common/.env
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: claude-arch/backend:local
    container_name: claude-arch-backend
    ports:
      - "4000:4000"
    env_file:
      - ./_common/.env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    image: claude-arch/mcp:local
    container_name: claude-arch-mcp
    ports:
      - "5000:5000"
    env_file:
      - ./_common/.env
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge
